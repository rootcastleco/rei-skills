[package]
name = "astryx-ds-server"
version = "0.7.18"
edition = "2021"
description = "Zero-dependency native Rust HTTP, MCP, and CLI design-system server for Meta Astryx (Rei Skills)"
license = "MIT"
readme = "../README.md"

[[bin]]
name = "astryx-ds-server"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
