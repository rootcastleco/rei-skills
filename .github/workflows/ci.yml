name: 🏰 REI Skills CI — Rootcastle Engineering & Innovation

permissions:
  contents: read

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-and-verify:
    name: 🏰 Validate, Audit, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 🏰 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📥 Install Python Dependencies
        run: pip install pyyaml

      - name: 📥 Install npm Dependencies
        run: npm ci

      - name: 🔬 Verify REI REA Sync Manifest Integrity
        run: python scripts/sync_rei_rea.py --check

      - name: ✅ Strict Skill Schema & Link Validation (Python)
        run: python scripts/validate_skills.py --strict --report data/quality-report.json

      - name: ✅ Frontmatter Validation (Node.js)
        run: node scripts/validate-skills.js

      - name: 🔗 Verify Workflow & Bundle References
        run: python scripts/validate_references.py

      - name: 🔒 Security & Guardrails Audit
        run: node scripts/security_audit.js

      - name: 🧪 Run Automated Test Suite (Headings + CLI Installer Safety)
        run: npm test

      - name: 🏗️ Rebuild Index, Catalog, README & Doc Site
        run: |
          python scripts/generate_index.py
          node scripts/build-catalog.js
          python scripts/update_readme.py --check
          node scripts/build-doc-site.js

      - name: 🚨 Deterministic Artifact Drift Check
        run: |
          if ! git diff --quiet -- skills_index.json data/skills_index.json data/catalog.json data/bundles.json data/aliases.json CATALOG.md README.md docs/site/index.html; then
            echo "❌ Generated catalog or documentation artifacts are out of sync."
            echo "Run 'npm run build' locally and commit the updated files."
            git status --short
            exit 1
          fi
