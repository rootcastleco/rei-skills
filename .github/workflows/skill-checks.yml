# NVIDIA SkillEvaluator v0.9.0; immutable workflow and image pins.
# REI Skills package version remains 6.6.0. This job does not publish npm or deploy Pages.
name: Skill checks

on:
  pull_request:
    paths:
      - 'skills/**'
      - '.github/workflows/skill-checks.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/skill-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@ba7779ad617c6444c98b6241a75bce92067e9d56
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:e96e3aaad89bf78c4f3f8c621e88005d18bd7c485b29c0d7945864700e5944e6
      paths: skills
      min-score: 70
      security-baselines: false
      scan-mode: auto
      enforcement-mode: advisory
      llm: false
