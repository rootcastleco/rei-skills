<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Rootcastle REI Skills Mark">
  <defs>
    <linearGradient id="reiBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3D8A"/>
      <stop offset="100%" stop-color="#1D5BC2"/>
    </linearGradient>
    <linearGradient id="reiGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#228B55"/>
      <stop offset="100%" stop-color="#2FB670"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="16" fill="#000000" stroke="#0E3D8A" stroke-width="2.5"/>
  <!-- Subtle pixel/instrumentation corner ticks -->
  <path d="M14 22 V14 H22 M98 14 H106 V22 M14 98 V106 H22 M98 106 H106 V98" fill="none" stroke="#228B55" stroke-width="2"/>
  <!-- Stylized Rootcastle Turret + PCB Circuit Nodes -->
  <path d="M32 34 H44 V44 H54 V34 H66 V44 H76 V34 H88 V56 L78 64 V88 H42 V64 L32 56 Z" fill="url(#reiBlue)" stroke="#3B82F6" stroke-width="1.5"/>
  <!-- Inner Core Gate / Binary Signal -->
  <rect x="52" y="66" width="16" height="22" rx="2" fill="#000000" stroke="#228B55" stroke-width="1.5"/>
  <!-- Signal Traces -->
  <line x1="20" y1="60" x2="32" y2="60" stroke="#228B55" stroke-width="2"/>
  <circle cx="20" cy="60" r="3" fill="#228B55"/>
  <line x1="88" y1="60" x2="100" y2="60" stroke="#228B55" stroke-width="2"/>
  <circle cx="100" cy="60" r="3" fill="#228B55"/>
  <circle cx="60" cy="52" r="3.5" fill="#2FB670"/>
</svg>
